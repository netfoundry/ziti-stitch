name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Runner images are pinned so that an image change (ubuntu-latest moves to
# Ubuntu 26 in October 2026) shows up as a deliberate edit here, not as a
# surprise failure.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check
      - run: make vuln
      - run: go test -race ./...

  build:
    name: build every release target
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build-all

  windows:
    name: unit tests on Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  e2e:
    name: two networks, OpenZiti ${{ matrix.ziti }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The newest release, and the oldest supported line. Tests that
        # need the caller's identity skip themselves before 2.0.
        ziti: ["2.0.6", "1.6.21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: start both networks
        run: ./deploy/local-e2e.sh up
        env:
          ZITI_VERSION: ${{ matrix.ziti }}
      - run: make e2e-test
      - name: keep the network logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ matrix.ziti }}
          path: .local-e2e/*.log
          retention-days: 7
          include-hidden-files: true # the harness writes under .local-e2e
      - name: stop both networks
        if: always()
        run: ./deploy/local-e2e.sh down

  tunnelers:
    name: real tunnelers on both sides
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: start both networks
        run: ./deploy/local-e2e.sh up
        env:
          ZITI_VERSION: "2.0.6"
      - name: client and host ziti-edge-tunnel through a stitch
        run: ./deploy/local-e2e.sh tunnelers
      - name: show the tunnelers' logs
        if: failure()
        run: |
          for f in .local-e2e/tunnel-*.log; do
            echo "::group::$f"
            tail -n 80 "$f"
            echo "::endgroup::"
          done
          ip addr; ip route; resolvectl status || true
      - name: keep the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tunnelers-logs
          path: .local-e2e/*.log
          retention-days: 7
          include-hidden-files: true # the harness writes under .local-e2e
      - name: stop everything
        if: always()
        run: ./deploy/local-e2e.sh down

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/scripts/install-helm.sh
      - run: helm lint charts/ziti-stitch -f charts/ziti-stitch/ci/test-values.yaml --strict
      - run: helm template ziti-stitch charts/ziti-stitch -f charts/ziti-stitch/ci/test-values.yaml >/dev/null

  # The one check the main branch ruleset requires, so that it need not
  # list every job (some names change with the version pins). It runs even
  # when a job it needs fails, since a skipped check would count as passed.
  passed:
    name: CI passed
    if: always()
    needs: [check, build, windows, e2e, tunnelers, chart]
    runs-on: ubuntu-24.04
    steps:
      - name: every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  release:
    name: release
    # Only for a version tag, and only once every other job has passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build, windows, e2e, tunnelers, chart]
    runs-on: ubuntu-24.04
    # The environment only accepts v* tags, which only admins can push. That
    # guards this job; anyone who can push a workflow could still publish
    # packages with its own token, so write access stays with maintainers.
    environment: release
    permissions:
      contents: write # create the GitHub release and upload its files
      packages: write # push the image and the chart to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser builds the changelog from the history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Any job on main can write the shared cache, including the weekly
          # one that runs unverified downloads; build releases from scratch.
          cache: false
      - name: log in to ghcr.io
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # BuildKit builds and pushes the image, so it is pinned like the
      # actions; buildx would otherwise pull the moving buildx-stable-1 tag.
      # Dependabot does not see it: bump it by hand.
      - name: a builder for multi-platform images
        run: docker buildx create --use --name multi --driver-opt image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # An rc tag on the same commit would otherwise win.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - run: .github/scripts/install-helm.sh
      - name: publish the Helm chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/ziti-stitch --version "$version" --app-version "$version"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "ziti-stitch-$version.tgz" oci://ghcr.io/netfoundry/charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
