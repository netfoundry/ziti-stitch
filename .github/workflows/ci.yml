name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check (gofmt + vet + staticcheck)
        run: make check
      - name: Test
        run: make test
      - name: Cross-compile every release target
        run: make build-all
