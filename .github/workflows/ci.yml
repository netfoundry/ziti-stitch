name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Runner images are pinned so that an image change (ubuntu-latest moves to
# Ubuntu 26 in October 2026) shows up as a deliberate edit here, not as a
# surprise failure.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check
      - run: go test -race ./...

  build:
    name: build every release target
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build-all

  windows:
    name: unit tests on Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  e2e:
    name: two networks, OpenZiti ${{ matrix.ziti }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The newest release, and the oldest supported line. Tests that
        # need the caller's identity skip themselves before 2.0.
        ziti: ["2.0.8", "1.6.21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: start both networks
        run: ./deploy/local-e2e.sh up
        env:
          ZITI_VERSION: ${{ matrix.ziti }}
      - run: make e2e-test
      - name: keep the network logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-${{ matrix.ziti }}
          path: .local-e2e/*.log
          retention-days: 7
      - name: stop both networks
        if: always()
        run: ./deploy/local-e2e.sh down

  tunnelers:
    name: real tunnelers on both sides
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: start both networks
        run: ./deploy/local-e2e.sh up
        env:
          ZITI_VERSION: "2.0.8"
      - name: client and host ziti-edge-tunnel through a stitch
        run: ./deploy/local-e2e.sh tunnelers
      - name: keep the logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tunnelers-logs
          path: .local-e2e/*.log
          retention-days: 7
      - name: stop everything
        if: always()
        run: ./deploy/local-e2e.sh down

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/scripts/install-helm.sh
      - run: helm lint charts/ziti-stitch -f charts/ziti-stitch/ci/test-values.yaml --strict
      - run: helm template ziti-stitch charts/ziti-stitch -f charts/ziti-stitch/ci/test-values.yaml >/dev/null

  release:
    name: release
    # Only for a version tag, and only once every other job has passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build, windows, e2e, tunnelers, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release and upload its files
      packages: write # push the image and the chart to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser builds the changelog from the history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: log in to ghcr.io
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: a builder for multi-platform images
        run: docker buildx create --use --name multi
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: .github/scripts/install-helm.sh
      - name: publish the Helm chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/ziti-stitch --version "$version" --app-version "$version"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "ziti-stitch-$version.tgz" oci://ghcr.io/netfoundry/charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
