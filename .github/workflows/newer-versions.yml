name: Newer versions

# Weekly early warning, not a gate: the e2e tests against the newest
# OpenZiti release and pre-release and the oldest supported version, and the
# tunnelers test with the newest ziti-edge-tunnel. CI pins its versions, so a
# failure here means a version we do not test yet (or the floor) breaks us.
# It also checks for vulnerability advisories published since the last change.

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: look up the versions
    runs-on: ubuntu-24.04
    outputs:
      ziti: ${{ steps.versions.outputs.ziti }}
      zet: ${{ steps.versions.outputs.zet }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        run: .github/scripts/newer-versions.sh | tee -a "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  # CI checks on every change; this catches advisories published since.
  vuln:
    name: known vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vuln

  e2e:
    name: two networks, OpenZiti ${{ matrix.ziti }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ziti: ${{ fromJSON(needs.resolve.outputs.ziti) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: start both networks
        run: ./deploy/local-e2e.sh up
        env:
          ZITI_VERSION: ${{ matrix.ziti }}
      - run: make e2e-test
      - name: keep the network logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ matrix.ziti }}
          path: .local-e2e/*.log
          retention-days: 7
          include-hidden-files: true # the harness writes under .local-e2e
      - name: stop both networks
        if: always()
        run: ./deploy/local-e2e.sh down

  tunnelers:
    name: real tunnelers, ziti-edge-tunnel ${{ needs.resolve.outputs.zet }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Its releases carry no checksums, so this one is unverified, unlike
      # the pinned one CI uses. The job has no secrets and writes nothing.
      - name: download ziti-edge-tunnel
        run: |
          zip="ziti-edge-tunnel-Linux_x86_64.zip"
          curl -fsSL -o "$RUNNER_TEMP/$zip" \
            "https://github.com/openziti/ziti-tunnel-sdk-c/releases/download/v$ZET_VERSION/$zip"
          unzip -q "$RUNNER_TEMP/$zip" ziti-edge-tunnel -d "$RUNNER_TEMP/zet"
          chmod +x "$RUNNER_TEMP/zet/ziti-edge-tunnel"
          echo "ZET_BIN=$RUNNER_TEMP/zet/ziti-edge-tunnel" >>"$GITHUB_ENV"
        env:
          ZET_VERSION: ${{ needs.resolve.outputs.zet }}
      - name: start both networks
        run: ./deploy/local-e2e.sh up
        env:
          ZITI_VERSION: ${{ fromJSON(needs.resolve.outputs.ziti)[0] }}
      - name: client and host ziti-edge-tunnel through a stitch
        run: ./deploy/local-e2e.sh tunnelers
      - name: keep the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tunnelers-logs
          path: .local-e2e/*.log
          retention-days: 7
          include-hidden-files: true # the harness writes under .local-e2e
      - name: stop everything
        if: always()
        run: ./deploy/local-e2e.sh down
