apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ziti-stitch.fullname" . }}
  labels:
    {{- include "ziti-stitch.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- merge (dict "health" (dict "listen" (printf ":%v" .Values.health.port))) (deepCopy .Values.config) | toYaml | nindent 4 }}
  stitches.yaml: |
    {{- dict "stitches" .Values.stitches | toYaml | nindent 4 }}
