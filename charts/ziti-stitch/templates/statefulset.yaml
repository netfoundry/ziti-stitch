{{- $fullname := include "ziti-stitch.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ziti-stitch.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Replicas are independent instances: one that cannot become ready (an
  # expired token, a missing policy) must not keep the others from being
  # created. Upgrades still go one pod at a time.
  podManagementPolicy: Parallel
  serviceName: {{ $fullname }}
  selector:
    matchLabels:
      {{- include "ziti-stitch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ziti-stitch.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ziti-stitch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            {{- if .Values.enrollment.secretName }}
            - --enroll-from=/enroll
            - --enroll-for=$(POD_NAME)
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ZITI_STITCH_CONFIG_DIR
              value: /config
            - name: ZITI_STITCH_CONFIG_SOURCE
              value: /etc/ziti-stitch
          ports:
            - name: health
              containerPort: {{ .Values.health.port }}
          # The health endpoint starts after --enroll-from, and each
          # enrollment may wait up to 2 minutes on its controller. Liveness
          # checks begin once this passes, so a slow start is not killed
          # halfway through redeeming a one-time token.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: source
              mountPath: /etc/ziti-stitch
              readOnly: true
            {{- if .Values.enrollment.secretName }}
            - name: enroll
              mountPath: /enroll
              readOnly: true
            {{- end }}
      volumes:
        - name: source
          configMap:
            name: {{ $fullname }}
        {{- if .Values.enrollment.secretName }}
        # The whole Secret: each pod picks its own keys by name
        # (--enroll-for), so the pod template does not depend on
        # replicaCount and scaling restarts nothing.
        - name: enroll
          secret:
            secretName: {{ .Values.enrollment.secretName }}
            # Deleted once every replica has enrolled; pods still start.
            optional: true
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "ziti-stitch.selectorLabels" . | nindent 20 }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
