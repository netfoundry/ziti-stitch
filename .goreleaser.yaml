version: 2

builds:
  - id: ziti-stitch
    main: ./cmd/ziti-stitch
    binary: ziti-stitch
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: ziti-stitch
    ids: [ziti-stitch]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      ziti-stitch_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - docs/install.md
      - docs/admin-checklist.md
      - docs/web-ui.md
      - docs/high-availability.md
      - docs/kubernetes.md

dockers_v2:
  - id: ziti-stitch
    ids: [ziti-stitch]
    dockerfile: Dockerfile
    images:
      - ghcr.io/netfoundry/ziti-stitch
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: ziti-stitch
      org.opencontainers.image.description: Stitches services across independent OpenZiti networks
      org.opencontainers.image.source: https://github.com/netfoundry/ziti-stitch
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0

checksum:
  name_template: checksums.txt

changelog:
  use: git
  filters:
    exclude:
      - "^notes"

release:
  draft: false
  prerelease: auto
  # Re-running a release that failed partway (after some files were
  # uploaded) replaces them instead of failing on the first one that exists.
  replace_existing_artifacts: true
