version: 2

builds:
  - id: ziti-stitch
    main: ./cmd/ziti-stitch
    binary: ziti-stitch
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: ziti-stitch
    ids: [ziti-stitch]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      ziti-stitch_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  filters:
    exclude:
      - "^notes"

release:
  draft: false
  prerelease: auto
